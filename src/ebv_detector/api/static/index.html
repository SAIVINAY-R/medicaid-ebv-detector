<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicaid Provider Fraud Intelligence — EBV Detector (React 18)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM, and Babel Standalone for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar & animations */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">

  <!-- Root mount point for React -->
  <div id="root"></div>

  <!-- React 18 JSX Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('enrollment');
      const [scenarios, setScenarios] = useState({});
      const [selectedScenarioKey, setSelectedScenarioKey] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [seeds, setSeeds] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [copiedSha, setCopiedSha] = useState(false);

      // Form state for enrollment
      const [formData, setFormData] = useState({
        legal_business_name: 'Sample Healthcare LLC',
        npi: '1900000001',
        tin: '56-1234567',
        service_category: 'BEHAVIORAL_HEALTH',
        formation_date: '2026-01-24',
        application_date: '2026-02-01',
        phone: '919-555-8822',
        address_line1: '1204 Main St',
        address_line2: 'PMB 402',
        city: 'Raleigh',
        state: 'NC',
        zip5: '27601',
        is_cmra: false,
        is_po_box: false,
        is_virtual: false,
        is_residential: false,
        eft_routing: '053000196',
        eft_account: '5544332211',
        person_name: 'Victor Vanish',
        person_role: 'OWNER',
        person_pct: '100',
        ssn_last4: '4912',
        dob: '1992-04-18',
        device_id: 'DEV-TEST-001',
        holding_org_id: '',
        upstream_owner_id: '',
        upstream_pct: '',
        policy_text: 'Standard behavioral health compliance and clinical operating procedures manual.'
      });

      // Claims surveillance form state
      const [claimsData, setClaimsData] = useState({
        npi: '1900000056',
        service_category: 'BEHAVIORAL_HEALTH',
        months_enrolled: 3,
        total_paid_30d: 186000,
        max_daily_hours: 36,
        inpatient_overlaps: 3,
        post_mortem_claims: 2,
        migrating_patients: 30
      });
      const [claimsResult, setClaimsResult] = useState(null);
      const [claimsLoading, setClaimsLoading] = useState(false);

      // Fetch pre-configured scenarios and seeds on mount
      useEffect(() => {
        fetch('/api/scenarios')
          .then(res => res.json())
          .then(data => setScenarios(data))
          .catch(err => console.error('Error fetching scenarios:', err));

        fetch('/api/seeds')
          .then(res => res.json())
          .then(data => setSeeds(data))
          .catch(err => console.error('Error fetching seeds:', err));
      }, []);

      // Fetch audit logs when tab selected
      useEffect(() => {
        if (activeTab === 'audit') {
          fetch('/api/audit-trail')
            .then(res => res.json())
            .then(data => setAuditLogs(data))
            .catch(err => console.error('Error fetching audit:', err));
        }
      }, [activeTab]);

      // Handle preset selection
      const handleSelectScenario = (key) => {
        setSelectedScenarioKey(key);
        if (!key || !scenarios[key]) return;
        const sc = scenarios[key];

        const p = sc.disclosed_persons && sc.disclosed_persons[0] ? sc.disclosed_persons[0] : {};
        const addr = sc.primary_address || {};
        const eft = sc.eft_account || {};

        setFormData({
          legal_business_name: sc.legal_business_name || '',
          npi: sc.npi || '',
          tin: sc.tin || '',
          service_category: sc.service_category || 'BEHAVIORAL_HEALTH',
          formation_date: sc.formation_date || '',
          application_date: sc.application_date || '',
          phone: sc.phone || '',
          address_line1: addr.address_line1 || '',
          address_line2: addr.address_line2 || '',
          city: addr.city || 'Raleigh',
          state: addr.state || 'NC',
          zip5: addr.zip5 || '27601',
          is_cmra: !!addr.is_cmra,
          is_po_box: !!addr.is_po_box,
          is_virtual: !!addr.is_virtual_mailbox,
          is_residential: (addr.rdi === 'RESIDENTIAL'),
          eft_routing: eft.routing_number || '',
          eft_account: eft.account_number || '',
          person_name: p.first_name ? `${p.first_name} ${p.last_name}` : 'Victor Vanish',
          person_role: p.role || 'OWNER',
          person_pct: p.direct_ownership_pct !== undefined ? String(p.direct_ownership_pct * 100) : '100',
          ssn_last4: p.ssn_last4 || '',
          dob: p.date_of_birth || '',
          device_id: sc.device_fingerprint_id || 'DEV-TEST-001',
          holding_org_id: sc.holding_org_id || '',
          upstream_owner_id: sc.upstream_owner_id || '',
          upstream_pct: sc.upstream_pct !== undefined ? String(sc.upstream_pct) : '',
          policy_text: sc.policy_manual_text || ''
        });
      };

      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleResetForm = () => {
        setSelectedScenarioKey('');
        setResult(null);
        setFormData({
          legal_business_name: '',
          npi: '',
          tin: '',
          service_category: 'FAMILY_PRACTICE',
          formation_date: '2026-01-01',
          application_date: '2026-02-01',
          phone: '',
          address_line1: '',
          address_line2: '',
          city: 'Raleigh',
          state: 'NC',
          zip5: '27601',
          is_cmra: false,
          is_po_box: false,
          is_virtual: false,
          is_residential: false,
          eft_routing: '',
          eft_account: '',
          person_name: '',
          person_role: 'OWNER',
          person_pct: '100',
          ssn_last4: '',
          dob: '',
          device_id: 'DEV-USER-001',
          holding_org_id: '',
          upstream_owner_id: '',
          upstream_pct: '',
          policy_text: ''
        });
      };

      // Submit screening to API
      const handleScreening = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);

        const nameParts = (formData.person_name || '').trim().split(' ');
        const firstName = nameParts[0] || 'Victor';
        const lastName = nameParts.slice(1).join(' ') || 'Vanish';

        const upPct = parseFloat(formData.upstream_pct);
        const personPct = parseFloat(formData.person_pct);

        const payload = {
          legal_business_name: formData.legal_business_name || 'Sample Healthcare LLC',
          npi: formData.npi || '1900000001',
          tin: formData.tin || '56-1234567',
          service_category: formData.service_category,
          formation_date: formData.formation_date || '2026-01-01',
          application_date: formData.application_date || '2026-02-01',
          phone: formData.phone || '919-555-8822',
          primary_address: {
            address_line1: formData.address_line1 || '100 Medical Plaza',
            address_line2: formData.address_line2 || '',
            city: formData.city || 'Raleigh',
            state: formData.state || 'NC',
            zip5: formData.zip5 || '27601',
            is_cmra: !!formData.is_cmra,
            is_po_box: !!formData.is_po_box,
            is_virtual_mailbox: !!formData.is_virtual,
            is_pmb: !!formData.is_virtual,
            rdi: formData.is_residential ? 'RESIDENTIAL' : 'COMMERCIAL'
          },
          eft_account: {
            routing_number: formData.eft_routing || '053000196',
            account_number: formData.eft_account || '1122334455'
          },
          disclosed_persons: [{
            first_name: firstName,
            last_name: lastName,
            role: formData.person_role,
            direct_ownership_pct: !isNaN(personPct) ? personPct / 100.0 : 1.0,
            ssn_last4: formData.ssn_last4 || '4912',
            date_of_birth: formData.dob || '1992-04-18'
          }],
          device_fingerprint_id: formData.device_id || 'DEV-TEST-001',
          holding_org_id: formData.holding_org_id || '',
          upstream_owner_id: formData.upstream_owner_id || '',
          upstream_pct: !isNaN(upPct) ? upPct / 100.0 : 0.0,
          policy_manual_text: formData.policy_text || ''
        };

        try {
          const res = await fetch('/api/evaluate/enrollment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            alert('Screening error: ' + (data.error || 'Server error ' + res.status));
          } else {
            setResult(data);
          }
        } catch (err) {
          alert('Network / evaluation error: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Submit claims surveillance
      const handleClaimsSubmit = async (e) => {
        if (e) e.preventDefault();
        setClaimsLoading(true);
        try {
          const res = await fetch('/api/evaluate/claims', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(claimsData)
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            alert('Claims error: ' + (data.error || 'Server error ' + res.status));
          } else {
            setClaimsResult(data);
          }
        } catch (err) {
          alert('Claims evaluation failed: ' + err.message);
        } finally {
          setClaimsLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        setCopiedSha(true);
        setTimeout(() => setCopiedSha(false), 2000);
      };

      return (
        <div className="flex flex-col min-h-screen">

          {/* HEADER BAR */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-slate-100 text-base sm:text-lg tracking-tight">Medicaid Provider Fraud Intelligence</h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/30">React 18</span>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span> ADR-0001
                  </span>
                </div>
                <p className="text-xs text-slate-400">Targeting "Enroll, Bill, Vanish" (EBV) Sham Providers & Straw Nominee Rings</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center gap-1 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
              <button
                onClick={() => setActiveTab('enrollment')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeTab === 'enrollment' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Enrollment Screening
              </button>
              <button
                onClick={() => setActiveTab('claims')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeTab === 'claims' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Claims Surveillance
              </button>
              <button
                onClick={() => setActiveTab('seeds')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeTab === 'seeds' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Seed Registry
              </button>
              <button
                onClick={() => setActiveTab('audit')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-all ${activeTab === 'audit' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                WORM Audit Log
              </button>
            </nav>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

            {/* TAB 1: ENROLLMENT SCREENING */}
            {activeTab === 'enrollment' && (
              <div className="space-y-6">

                {/* Demonstration Preset Bar */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg backdrop-blur">
                  <div className="flex items-center gap-3 flex-1 min-w-[320px]">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">Load Pre-Configured Test Case:</span>
                    <select
                      value={selectedScenarioKey}
                      onChange={(e) => handleSelectScenario(e.target.value)}
                      className="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 flex-1 outline-none focus:border-blue-500 font-medium"
                    >
                      <option value="">-- Select a Real-World Scenario to Populate Form --</option>
                      <option value="control">Control: Triangle Pediatrics PLLC (Legitimate Established 2012)</option>
                      <option value="scenario1">Scenario 1: Apex Autism LLC (Formed 8d Ago + Mailbox Store CMRA)</option>
                      <option value="scenario2">Scenario 2: Horizon Community Recovery (Straw Owner + 48% Excluded Felon)</option>
                      <option value="scenario3">Scenario 3: Beacon Southern Healthcare (Phoenix Re-Entry with Terminated EFT)</option>
                      <option value="scenario4">Scenario 4: Serenity Community Living (Cloned Policy Manual Ring)</option>
                    </select>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleResetForm}
                      className="px-3 py-2 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                    >
                      Reset Form
                    </button>
                  </div>
                </div>

                {/* Grid: Left = Form, Right = Assessment Card */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                  {/* FORM COLUMN (5 Cols on large screen) */}
                  <div className="lg:col-span-6 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur space-y-5">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                      <div>
                        <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                          <svg className="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                          </svg>
                          Provider Application Form
                        </h2>
                        <p className="text-xs text-slate-400">Captures disclosures required by 42 CFR Part 455</p>
                      </div>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-400">Checkpoint 1</span>
                    </div>

                    <form id="enrollment-form" onSubmit={handleScreening} className="space-y-4 text-xs">

                      {/* Basic Org Info */}
                      <div className="space-y-1">
                        <label className="font-semibold text-slate-300">Legal Business Name</label>
                        <input
                          type="text"
                          value={formData.legal_business_name}
                          onChange={(e) => handleInputChange('legal_business_name', e.target.value)}
                          placeholder="e.g. Triangle Behavioral Health LLC"
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500"
                          required
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="font-semibold text-slate-300">NPI Number (10 Digits)</label>
                          <input
                            type="text"
                            value={formData.npi}
                            onChange={(e) => handleInputChange('npi', e.target.value)}
                            placeholder="e.g. 1900000046"
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500 font-mono"
                            required
                          />
                        </div>
                        <div className="space-y-1">
                          <label className="font-semibold text-slate-300">Tax ID (TIN / EIN)</label>
                          <input
                            type="text"
                            value={formData.tin}
                            onChange={(e) => handleInputChange('tin', e.target.value)}
                            placeholder="56-XXXXXXX"
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500 font-mono"
                            required
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="font-semibold text-slate-300">Service Category</label>
                          <select
                            value={formData.service_category}
                            onChange={(e) => handleInputChange('service_category', e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-slate-100 outline-none focus:border-blue-500"
                          >
                            <option value="PEDIATRIC_CLINIC">Pediatric Clinic (Limited Risk)</option>
                            <option value="FAMILY_PRACTICE">Family Practice (Limited Risk)</option>
                            <option value="COMMUNITY_HEALTH_FQHC">Community Health FQHC (Limited)</option>
                            <option value="BEHAVIORAL_HEALTH">Behavioral Health / SUD (Moderate)</option>
                            <option value="AUTISM_CLINIC_FACILITY">Autism ABA Clinic (Moderate)</option>
                            <option value="SOBER_LIVING_FACILITY">Sober Living Facility (Moderate)</option>
                            <option value="ADULT_DAY_CARE">Adult Day Care (Moderate)</option>
                            <option value="HCBS">HCBS Personal Care (High Risk)</option>
                            <option value="HOSPICE">Hospice (High Risk)</option>
                          </select>
                        </div>
                        <div className="space-y-1">
                          <label className="font-semibold text-slate-300">SoS Formation Date</label>
                          <input
                            type="date"
                            value={formData.formation_date}
                            onChange={(e) => handleInputChange('formation_date', e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500"
                          />
                        </div>
                      </div>

                      {/* Practice Address & Melissa Flags */}
                      <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-slate-200">Practice Location & Address Hygiene</span>
                          <span className="text-[10px] text-blue-400 font-semibold uppercase">DATA-039 Check</span>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                          <div className="col-span-2 space-y-1">
                            <label className="text-slate-400">Street Address Line 1</label>
                            <input
                              type="text"
                              value={formData.address_line1}
                              onChange={(e) => handleInputChange('address_line1', e.target.value)}
                              placeholder="1204 Main St"
                              className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 outline-none"
                            />
                          </div>
                          <div className="space-y-1">
                            <label className="text-slate-400">Suite / PMB #</label>
                            <input
                              type="text"
                              value={formData.address_line2}
                              onChange={(e) => handleInputChange('address_line2', e.target.value)}
                              placeholder="PMB 402"
                              className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 outline-none"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                          <input
                            type="text"
                            value={formData.city}
                            onChange={(e) => handleInputChange('city', e.target.value)}
                            placeholder="City"
                            className="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 outline-none"
                          />
                          <input
                            type="text"
                            value={formData.state}
                            onChange={(e) => handleInputChange('state', e.target.value)}
                            placeholder="State"
                            className="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 outline-none"
                          />
                          <input
                            type="text"
                            value={formData.zip5}
                            onChange={(e) => handleInputChange('zip5', e.target.value)}
                            placeholder="Zip"
                            className="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 outline-none font-mono"
                          />
                        </div>

                        {/* Melissa Checkboxes */}
                        <div className="flex flex-wrap gap-3 pt-1">
                          <label className="flex items-center gap-1.5 text-slate-300 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={formData.is_cmra}
                              onChange={(e) => handleInputChange('is_cmra', e.target.checked)}
                              className="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0"
                            />
                            CMRA (Mailbox Store)
                          </label>
                          <label className="flex items-center gap-1.5 text-slate-300 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={formData.is_po_box}
                              onChange={(e) => handleInputChange('is_po_box', e.target.checked)}
                              className="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0"
                            />
                            PO Box
                          </label>
                          <label className="flex items-center gap-1.5 text-slate-300 cursor-pointer">
                            <input
                              type="checkbox"

                        min="0"
                        value={claimsData.post_mortem_claims}
                        onChange={(e) => setClaimsData({ ...claimsData, post_mortem_claims: parseInt(e.target.value) || 0 })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="font-semibold text-slate-300">Migrating Patients (from Suspended Provider)</label>
                      <input
                        type="number"
                        min="0"
                        value={claimsData.migrating_patients}
                        onChange={(e) => setClaimsData({ ...claimsData, migrating_patients: parseInt(e.target.value) || 0 })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none"
                      />
                    </div>

                    <div className="sm:col-span-2 pt-2">
                      <button
                        type="submit"
                        disabled={claimsLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 font-bold text-white py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2"
                      >
                        {claimsLoading ? 'Evaluating Claims Network...' : 'Evaluate Claims Surveillance'}
                      </button>
                    </div>
                  </form>

                  {/* Claims Output */}
                  {claimsResult && (
                    <div className="space-y-4 pt-4 border-t border-slate-800 animate-in fade-in">
                      <div className={`p-4 rounded-xl border flex items-center justify-between ${
                        claimsResult.trigger_payment_suspension
                          ? 'bg-red-500/10 border-red-500/40 text-red-200'
                          : 'bg-amber-500/10 border-amber-500/40 text-amber-200'
                      }`}>
                        <div>
                          <div className="font-bold text-sm">
                            {claimsResult.trigger_payment_suspension ? 'PAYMENT SUSPENSION TRIGGERED (42 CFR 455.23)' : 'ENHANCED OVERSIGHT DESK AUDIT'}
                          </div>
                          <div className="text-xs opacity-90">{claimsResult.recommended_cpmm_action}</div>
                        </div>
                        <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full uppercase ${
                          claimsResult.trigger_payment_suspension ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/20 text-amber-300'
                        }`}>
                          {claimsResult.trigger_payment_suspension ? 'CAF HOLD' : 'AUDIT'}
                        </span>
                      </div>

                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                        <div>
                          <span className="text-slate-400 text-[10px] uppercase font-semibold">Total Paid</span>
                          <div className="font-bold font-mono text-sm text-slate-100">${claimsResult.ramp_result.total_paid_30d.toLocaleString()}</div>
                        </div>
                        <div>
                          <span className="text-slate-400 text-[10px] uppercase font-semibold">Robust Z-Score</span>
                          <div className="font-bold font-mono text-sm text-amber-400">+{claimsResult.ramp_result.robust_z_score.toFixed(1)}x</div>
                        </div>
                        <div>
                          <span className="text-slate-400 text-[10px] uppercase font-semibold">Impossible Daily Hrs</span>
                          <div className="font-bold font-mono text-sm text-red-400">{claimsResult.ramp_result.impossible_hours_count}</div>
                        </div>
                        <div>
                          <span className="text-slate-400 text-[10px] uppercase font-semibold">Site Visit Mandated</span>
                          <div className="font-bold text-sm text-blue-400">{claimsResult.trigger_unannounced_site_visit ? 'YES' : 'NO'}</div>
                        </div>
                      </div>

                      {/* Claims Evidence Items */}
                      <div className="space-y-2">
                        {claimsResult.evidence_items.map((ev, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs">
                            <span className="font-mono font-bold text-red-400">[{ev.severity}] {ev.code}</span>
                            <p className="text-slate-300 mt-1">{ev.description}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

            {/* TAB 3: SEED REGISTRY */}
            {activeTab === 'seeds' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-bold text-slate-100">Known-Bad Seed Database (LEIE, SAM, State Terminations)</h2>
                    <p className="text-xs text-slate-400">Matched in real-time across Layer 1 rules, graph CTEs, and Personalized PageRank.</p>
                  </div>
                  <span className="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-slate-300">{seeds.length} Active Seeds</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400">
                        <th className="py-2.5 px-3">Seed ID</th>
                        <th className="py-2.5 px-3">Type</th>
                        <th className="py-2.5 px-3">Identifier Value</th>
                        <th className="py-2.5 px-3">Source</th>
                        <th className="py-2.5 px-3">Sanction Reason</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 font-mono">
                      {seeds.map((s, i) => (
                        <tr key={i} className="hover:bg-slate-800/30 transition">
                          <td className="py-2.5 px-3 text-blue-400 font-bold">{s.seed_id}</td>
                          <td className="py-2.5 px-3">{s.identifier_type}</td>
                          <td className="py-2.5 px-3 text-slate-200 font-bold">{s.identifier_value}</td>
                          <td className="py-2.5 px-3">
                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30">
                              {s.source}
                            </span>
                          </td>
                          <td className="py-2.5 px-3 font-sans text-slate-400">{s.reason}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 4: AUDIT EXPLORER */}
            {activeTab === 'audit' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-bold text-slate-100">Immutable WORM Audit Trail Explorer</h2>
                    <p className="text-xs text-slate-400">Cryptographically chained SHA-256 decision records complying with NC RFP Attachment C Section 5.</p>
                  </div>
                  <button
                    onClick={() => {
                      fetch('/api/audit-trail').then(r => r.json()).then(d => setAuditLogs(d));
                    }}
                    className="text-xs text-blue-400 hover:text-blue-300 font-semibold"
                  >
                    Refresh Logs
                  </button>
                </div>

                {auditLogs.length === 0 ? (
                  <p className="text-xs text-slate-500 py-8 text-center">No decisions logged in this session yet.</p>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400">
                          <th className="py-2.5 px-3">Record ID</th>
                          <th className="py-2.5 px-3">App ID</th>
                          <th className="py-2.5 px-3">Layer 1 Status</th>
                          <th className="py-2.5 px-3">Priority</th>
                          <th className="py-2.5 px-3">Timestamp (UTC)</th>
                          <th className="py-2.5 px-3">SHA-256 Fingerprint</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-mono text-[11px]">
                        {auditLogs.map((l, i) => (
                          <tr key={i} className="hover:bg-slate-800/30 transition">
                            <td className="py-2 px-3 text-blue-400 font-bold">{l.record_id}</td>
                            <td className="py-2 px-3">{l.application_id}</td>
                            <td className="py-2 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                l.layer1_status === 'DENIED_GROUNDS' ? 'text-red-400 bg-red-500/20' :
                                l.layer1_status === 'REVIEW_REQUIRED' ? 'text-amber-400 bg-amber-500/20' :
                                'text-emerald-400 bg-emerald-500/20'
                              }`}>
                                {l.layer1_status}
                              </span>
                            </td>
                            <td className="py-2 px-3 font-bold text-slate-200">{l.advisory_priority_score}</td>
                            <td className="py-2 px-3 text-slate-400">{l.timestamp_utc}</td>
                            <td className="py-2 px-3 text-slate-500 truncate max-w-[200px]">{l.feature_vector_sha256}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-900 bg-slate-950 py-4 px-6 text-center text-xs text-slate-500">
            Medicaid Provider Fraud Intelligence &bull; ADR-0001 Architecture &bull; 42 CFR 455 &bull; NC RFP Attachment C Section 3 Compliant
          </footer>

        </div>
      );
    }

    // Render React 18 application into #root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
